name: Verify and build unsigned Nexus source
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'source/**'
      - 'scripts/**'
      - 'launcher/**'
      - 'build_release.py'
      - 'brand_runtime.py'
      - 'build-inputs.json'
      - 'signing/dependency-lock.json'
      - '.github/workflows/nexus-review-build.yml'
permissions:
  contents: read
jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14.3'
          architecture: x64
      - run: python scripts/restore_build_inputs.py
      - run: python scripts/check_signing_inputs.py
      - name: Test input validation and runtime packaging
        env:
          PYTHONPATH: source;source/tests
        run: |
          python -m unittest discover -s source/tests -p test_review_inputs.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s source/tests -p test_signing_pipeline.py -v
      - run: python scripts/build_ci_runtime.py --out build/ci-runtime.zip
      - run: python build_release.py --nexus --runtime build/ci-runtime.zip --out dist/ci
      - uses: actions/upload-artifact@v7
        with:
          name: unsigned-nexus-review-build
          path: |
            dist/ci/nexus/*
            build/ci-runtime.provenance.json
